<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
</head>
<body>

    <h1>Product Details</h1>

    <p>Product ID: {{ product.id }}</p>

    <p>Name: {{ product.name }}</p>

    <p>Description: {{ product.description }}</p>

    <p>Price: {{ product.price }}</p>

    <br>

    <a href="{% url 'generate_pdf' product.id %}">
        <button type="button">Download as PDF</button>
    </a>

    <form method="POST" action="{% url 'send_product_email' product.id %}">
        {% csrf_token %}

        <button type="submit">Send Product Info by Email</button>
    </form>

</body>
</html>
