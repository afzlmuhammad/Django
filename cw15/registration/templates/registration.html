<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <p>Enter your details and upload your ID card.</p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <table>
            {{ form.as_table }}
        </table>

        <br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
