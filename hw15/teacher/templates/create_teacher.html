<!DOCTYPE html>
<html>
<head>
    <title>Teacher Registration</title>
</head>

<body>

    <h1>Teacher Registration Form</h1>

    <p>Enter your details and upload your profile photo.</p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <table>
            {{ form.as_table }}
        </table>

        <br>

        <input type="submit" value="Save Teacher">

    </form>

</body>
</html>
